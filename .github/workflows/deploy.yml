name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for the OIDC AWS role assumption
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build:contracts

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Debug OIDC token claims (temporary — remove once trust policy is confirmed)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            console.log('sub:', payload.sub);
            console.log('aud:', payload.aud);
            console.log('ref:', payload.ref);
            console.log('environment:', payload.environment);

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy WebStack (S3 + CloudFront)
        working-directory: infra
        run: npx cdk deploy WebStack --require-approval never --outputs-file web-outputs.json

      - name: Deploy ApiStack (Lambda + Function URL)
        working-directory: infra
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYMENTS_API_URL: ${{ secrets.PAYMENTS_API_URL }}
          PAYMENTS_PUBLIC_KEY: ${{ secrets.PAYMENTS_PUBLIC_KEY }}
          PAYMENTS_PRIVATE_KEY: ${{ secrets.PAYMENTS_PRIVATE_KEY }}
          PAYMENTS_INTEGRITY_KEY: ${{ secrets.PAYMENTS_INTEGRITY_KEY }}
          PAYMENTS_EVENTS_KEY: ${{ secrets.PAYMENTS_EVENTS_KEY }}
        run: npx cdk deploy ApiStack --require-approval never --outputs-file api-outputs.json

      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Seed products (idempotent — safe to run on every deploy)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx ts-node prisma/seed.ts

      - name: Resolve stack outputs
        id: outputs
        working-directory: infra
        run: |
          API_URL=$(jq -r '.ApiStack.ApiUrl' api-outputs.json | sed 's:/*$::')
          WEB_URL=$(jq -r '.WebStack.WebUrl' web-outputs.json)
          BUCKET=$(jq -r '.WebStack.WebBucketName' web-outputs.json)
          DISTRIBUTION_ID=$(jq -r '.WebStack.DistributionId' web-outputs.json)
          {
            echo "api_url=$API_URL"
            echo "web_url=$WEB_URL"
            echo "bucket=$BUCKET"
            echo "distribution_id=$DISTRIBUTION_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Build web app against the live API URL
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ steps.outputs.outputs.api_url }}
          VITE_PAYMENTS_API_URL: ${{ secrets.PAYMENTS_API_URL }}
          VITE_PAYMENTS_PUBLIC_KEY: ${{ secrets.PAYMENTS_PUBLIC_KEY }}
        run: npm run build

      - name: Sync web build to S3
        run: aws s3 sync apps/web/dist "s3://${{ steps.outputs.outputs.bucket }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.distribution_id }}" --paths '/*'

      - name: Deployment summary
        run: |
          echo "API: ${{ steps.outputs.outputs.api_url }}"
          echo "Web: ${{ steps.outputs.outputs.web_url }}"
