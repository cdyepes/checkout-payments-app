name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for Workload Identity Federation
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Testing
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build:contracts

      # Migrations run before the new API revision is deployed: a breaking schema
      # change means the old ordering (deploy, then migrate) would serve the new
      # code against the old schema for the whole deploy window. Migrating first
      # narrows the broken window to "old revision + new schema" (only writes that
      # rely on now-dropped columns fail) instead of "new revision + old schema"
      # (reads fail too, e.g. `include: { items: true }` against a table that
      # doesn't exist yet).
      - name: Generate Prisma client
        run: npm run db:generate -w @checkout/api

      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Seed products (idempotent — safe to run on every deploy)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx ts-node prisma/seed.ts

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/checkout-api/api:${{ github.sha }}"
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy API to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYMENTS_API_URL: ${{ secrets.PAYMENTS_API_URL }}
          PAYMENTS_PUBLIC_KEY: ${{ secrets.PAYMENTS_PUBLIC_KEY }}
          PAYMENTS_PRIVATE_KEY: ${{ secrets.PAYMENTS_PRIVATE_KEY }}
          PAYMENTS_INTEGRITY_KEY: ${{ secrets.PAYMENTS_INTEGRITY_KEY }}
          PAYMENTS_EVENTS_KEY: ${{ secrets.PAYMENTS_EVENTS_KEY }}
        run: |
          # Firebase Hosting's default URL is predictable (project-id.web.app),
          # unlike CloudFront's randomly-generated domain — no chicken-and-egg
          # ordering needed between the two deploys.
          CORS_ORIGIN="https://${GCP_PROJECT_ID}.web.app"

          cat > /tmp/env-vars.yaml <<EOF
          NODE_ENV: "production"
          CORS_ORIGIN: "${CORS_ORIGIN}"
          DATABASE_URL: "${DATABASE_URL}"
          PAYMENTS_API_URL: "${PAYMENTS_API_URL}"
          PAYMENTS_PUBLIC_KEY: "${PAYMENTS_PUBLIC_KEY}"
          PAYMENTS_PRIVATE_KEY: "${PAYMENTS_PRIVATE_KEY}"
          PAYMENTS_INTEGRITY_KEY: "${PAYMENTS_INTEGRITY_KEY}"
          PAYMENTS_EVENTS_KEY: "${PAYMENTS_EVENTS_KEY}"
          EOF

          gcloud run deploy checkout-api \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --allow-unauthenticated \
            --env-vars-file /tmp/env-vars.yaml \
            --quiet

          rm -f /tmp/env-vars.yaml

      - name: Resolve Cloud Run URL
        id: outputs
        run: |
          API_URL=$(gcloud run services describe checkout-api \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Build web app against the live API URL
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ steps.outputs.outputs.api_url }}
          VITE_PAYMENTS_API_URL: ${{ secrets.PAYMENTS_API_URL }}
          VITE_PAYMENTS_PUBLIC_KEY: ${{ secrets.PAYMENTS_PUBLIC_KEY }}
        run: npm run build

      - name: Pin CSP connect-src to the resolved Cloud Run origin
        working-directory: apps/web
        env:
          API_URL: ${{ steps.outputs.outputs.api_url }}
        run: |
          # firebase.json ships with a wildcard (https://*.run.app) since the
          # exact per-service hostname isn't known until after first deploy;
          # now that it's resolved, swap in the literal origin so the CSP
          # doesn't trust every Cloud Run service on the shared domain.
          node -e "
            const fs = require('fs');
            const path = 'firebase.json';
            const before = fs.readFileSync(path, 'utf8');
            const after = before.replaceAll('https://*.run.app', process.env.API_URL);
            fs.writeFileSync(path, after);
          "

      - name: Deploy web app to Firebase Hosting
        working-directory: apps/web
        run: npx firebase-tools deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive

      - name: Deployment summary
        run: |
          echo "API: ${{ steps.outputs.outputs.api_url }}"
          echo "Web: https://${GCP_PROJECT_ID}.web.app"
